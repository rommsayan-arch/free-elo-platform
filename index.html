<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE ELO - Platform & OBS Overlay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .main-container {
            width: 100%;
            max-width: 900px;
            background: #151922;
            border: 1px solid #ff5500;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 25px rgba(255, 85, 0, 0.2);
        }
        h1 {
            color: #ff5500;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .section-title {
            font-size: 14px;
            color: #8a99ad;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .box {
            background: rgba(18, 18, 24, 0.9);
            border: 2px solid rgba(255, 85, 0, 0.6);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 15px;
        }
        .team {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            flex: 1;
        }
        .label {
            font-size: 11px;
            text-transform: uppercase;
            color: #ff5500;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .name {
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }
        .vs {
            color: #ff5500;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0 20px;
        }
        .score {
            font-size: 32px;
            font-weight: bold;
        }
        .url-box {
            margin-top: 20px;
            background: #0b0e14;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #2a344a;
            word-break: break-all;
            font-family: monospace;
            font-size: 13px;
            color: #00ff66;
        }
        .control-panel {
            margin-top: 20px;
            background: #11141d;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #2a344a;
        }
        .control-panel input, .control-panel button {
            padding: 10px;
            margin: 5px 0;
            background: #1c2331;
            border: 1px solid #ff5500;
            color: #fff;
            border-radius: 5px;
            width: 100%;
        }
        .control-panel button {
            background: #ff5500;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .control-panel button:hover {
            background: #ff7733;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>FREE ELO</h1>
        <div class="section-title">OBS Overlay HUD Preview:</div>
        
        <div id="obsContainer">
            <!-- Динамический контент оверлея -->
        </div>

        <div class="url-box" id="currentUrlBox">Загрузка ссылки...</div>

        <div class="control-panel">
            <div class="section-title" style="margin-bottom: 10px;">Панель управления матчем</div>
            <input type="text" id="p1Input" placeholder="Игрок 1" value="SAYAN">
            <input type="text" id="p2Input" placeholder="Игрок 2" value="PLAYER2">
            <input type="text" id="c1Input" placeholder="Клан 1" value="NUN">
            <input type="text" id="c2Input" placeholder="Клан 2" value="WAKANDA">
            <div style="display: flex; gap: 10px;">
                <input type="number" id="s1Input" placeholder="Счет 1" value="0">
                <input type="number" id="s2Input" placeholder="Счет 2" value="0">
            </div>
            <button onclick="saveData()">Сохранить и обновить</button>
        </div>
    </div>

    <script>
        function saveData() {
            const data = {
                player1: document.getElementById('p1Input').value,
                player2: document.getElementById('p2Input').value,
                clan1: document.getElementById('c1Input').value,
                clan2: document.getElementById('c2Input').value,
                score1: document.getElementById('s1Input').value,
                score2: document.getElementById('s2Input').value
            };
            localStorage.setItem('free_elo_obs_data', JSON.stringify(data));
            updateObsView(data);
        }

        function updateObsView(sd) {
            const urlParams = new URLSearchParams(window.location.search);
            const obsMode = urlParams.get('obs');
            const obsContainer = document.getElementById('obsContainer');

            if (obsMode === 'clans') {
                obsContainer.innerHTML = `
                    <div class="box">
                        <div class="team">
                            <span class="label">Клан 1</span>
                            <span class="name">${sd.clan1 || 'NUN'}</span>
                        </div>
                        <div class="score" style="color: #00ff66;">${sd.score1 ?? 0}</div>
                        <div class="vs">VS</div>
                        <div class="score" style="color: #ff3333;">${sd.score2 ?? 0}</div>
                        <div class="team" style="align-items: flex-end;">
                            <span class="label">Клан 2</span>
                            <span class="name">${sd.clan2 || 'WAKANDA'}</span>
                        </div>
                    </div>
                `;
            } else {
                obsContainer.innerHTML = `
                    <div class="box">
                        <div class="team">
                            <span class="label">[${sd.clan1 || 'NUN'}]</span>
                            <span class="name">${sd.player1 || 'PLAYER1'}</span>
                        </div>
                        <div class="score" style="color: #ff5500; font-size: 24px;">${sd.score1 ?? 0} : ${sd.score2 ?? 0}</div>
                        <div class="team" style="align-items: flex-end;">
                            <span class="label">[${sd.clan2 || 'WAKANDA'}]</span>
                            <span class="name">${sd.player2 || 'PLAYER2'}</span>
                        </div>
                    </div>
                `;
            }
        }

        function initApp() {
            document.getElementById('currentUrlBox').innerText = window.location.href;

            let sd = { player1: 'SAYAN', clan1: 'NUN', score1: 0, player2: 'PLAYER2', clan2: 'WAKANDA', score2: 0 };
            
            const saved = localStorage.getItem('free_elo_obs_data');
            if (saved) {
                try {
                    sd = JSON.parse(saved);
                    document.getElementById('p1Input').value = sd.player1 || 'SAYAN';
                    document.getElementById('p2Input').value = sd.player2 || 'PLAYER2';
                    document.getElementById('c1Input').value = sd.clan1 || 'NUN';
                    document.getElementById('c2Input').value = sd.clan2 || 'WAKANDA';
                    document.getElementById('s1Input').value = sd.score1 ?? 0;
                    document.getElementById('s2Input').value = sd.score2 ?? 0;
                } catch(e) {}
            }

            updateObsView(sd);
        }

        window.onload = initApp;
    </script>
</body>
</html>
