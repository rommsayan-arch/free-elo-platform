<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELO Match</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #11131a;
        font-family: Arial, sans-serif;
        color: white;
    }

    .match {
        width: 900px;
        padding: 35px;
        background: linear-gradient(135deg, #171a24, #0c0e14);
        border-radius: 18px;
        border: 1px solid #343847;
    }

    /* ВЕРХНИЕ НИКИ */

    .players {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 25px;
    }

    .player {
        width: 330px;
        min-height: 110px;
        padding: 18px 25px;
        border-radius: 12px;
        border: 2px solid #7c4dff;
        background: linear-gradient(135deg, #202536, #141722);
        box-shadow: 0 0 20px rgba(124, 77, 255, 0.15);
    }

    .player-left {
        text-align: right;
    }

    .player-right {
        text-align: left;
    }

    .nickname {
        font-size: 28px;
        font-weight: 900;
        text-transform: uppercase;
    }

    .stats {
        display: flex;
        gap: 18px;
        margin-top: 12px;
        color: #9da3b5;
        font-size: 13px;
    }

    .player-left .stats {
        justify-content: flex-end;
    }

    .stat b {
        display: block;
        color: #fff;
        font-size: 17px;
    }

    /* VS */

    .vs {
        font-size: 32px;
        font-weight: 1000;
        font-style: italic;
        color: #ffd43b;
        text-shadow: 0 0 15px rgba(255, 212, 59, .5);
    }

    /* НИЖНИЕ ГИЛЬДИИ */

    .guilds {
        margin-top: 35px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 25px;
    }

    .guild {
        width: 330px;
        padding: 15px 20px;
        border-radius: 10px;
        background: #151821;
        border: 2px solid #24e6b4;
    }

    .guild-right {
        border-color: #ff4d70;
    }

    .guild-label {
        font-size: 11px;
        color: #7e8496;
        text-transform: uppercase;
        margin-bottom: 5px;
    }

    .guild-name {
        font-size: 22px;
        font-weight: 900;
        text-transform: uppercase;
    }

    .guild-elo {
        margin-top: 7px;
        font-size: 14px;
        color: #24e6b4;
    }

    .guild-right .guild-elo {
        color: #ff4d70;
    }

    /* АДАПТАЦИЯ ДЛЯ ТЕЛЕФОНА */

    @media (max-width: 700px) {
        .match {
            width: 95%;
            padding: 20px;
        }

        .players,
        .guilds {
            gap: 10px;
        }

        .player,
        .guild {
            width: 42%;
        }

        .nickname {
            font-size: 18px;
        }

        .guild-name {
            font-size: 16px;
        }

        .vs {
            font-size: 20px;
        }

        .stats {
            gap: 7px;
            font-size: 10px;
        }

        .stat b {
            font-size: 13px;
        }
    }
</style>
</head>

<body>

<div class="match">

    <!-- НИК VS НИК -->
    <div class="players">

        <div class="player player-left">
            <div class="nickname">2012</div>

            <div class="stats">
                <div class="stat">
                    ELO
                    <b>474</b>
                </div>

                <div class="stat">
                    WIN
                    <b>0%</b>
                </div>

                <div class="stat">
                    K/D
                    <b>0.67</b>
                </div>
            </div>
        </div>

        <div class="vs">VS</div>

        <div class="player player-right">
            <div class="nickname">ПЭИН</div>

            <div class="stats">
                <div class="stat">
                    ELO
                    <b>559</b>
                </div>

                <div class="stat">
                    WIN
                    <b>63%</b>
                </div>

                <div class="stat">
                    K/D
                    <b>1.94</b>
                </div>
            </div>
        </div>

    </div>


    <!-- ГИЛЬДИЯ VS ГИЛЬДИЯ -->
    <div class="guilds">

        <div class="guild">
            <div class="guild-label">Гильдия</div>
            <div class="guild-name">FROSTBITE</div>
            <div class="guild-elo">ELO 1044</div>
        </div>

        <div class="vs">VS</div>

        <div class="guild guild-right">
            <div class="guild-label">Гильдия</div>
            <div class="guild-name">VEYRON</div>
            <div class="guild-elo">ELO 948</div>
        </div>

    </div>

</div>

</body>
</html>
