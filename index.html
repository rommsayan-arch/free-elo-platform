<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FREE ELO - Matchmaking Platform</title>
    <style>
        :root { --accent: #ff3333; --bg: #0a0a0f; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; }
        #mainContainer { padding: 20px; }
        .page-content { display: none; }
        .page-content.active { display: block; }
        
        /* OBS NEON STYLE */
        .obs-overlay-mode { display: flex; justify-content: center; align-items: center; height: 100vh; background: transparent; }
        .obs-cyber-wrapper {
            display: flex; align-items: center; gap: 20px;
            background: rgba(10, 10, 15, 0.85);
            border: 2px solid var(--accent);
            box-shadow: 0 0 25px rgba(255, 51, 51, 0.4);
            padding: 15px 30px; border-radius: 12px; backdrop-filter: blur(5px);
        }
        .obs-team-box { display: flex; flex-direction: column; align-items: center; min-width: 180px; }
        .obs-clan-tag {
            font-size: 14px; font-weight: 700; color: #00be63;
            background: rgba(0, 190, 99, 0.15); padding: 2px 10px;
            border-radius: 6px; border: 1px solid rgba(0, 190, 99, 0.3);
            margin-bottom: 4px; text-transform: uppercase;
        }
        .obs-player-name { font-size: 22px; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .obs-vs-badge { font-size: 20px; font-weight: 900; color: var(--accent); font-style: italic; padding: 0 10px; }
    </style>
</head>
<body>

    <!-- OBS OWERLAY -->
    <div id="obsOverlayContainer" style="display: none;"></div>

    <!-- MAIN APP -->
    <div id="mainContainer">
        <h1>FREE ELO Platform</h1>
        <div id="page-matches" class="page-content active">
            <input id="streamMatchPlayer1" placeholder="Игрок 1">
            <input id="streamMatchPlayer2" placeholder="Игрок 2">
            <button onclick="finishStreamMatch(1)">Победил 1</button>
            <button onclick="finishStreamMatch(2)">Победил 2</button>
            <div id="streamMatchResult"></div>
        </div>
    </div>

    <!-- AUTH -->
    <div id="authModal" style="display: flex; flex-direction: column; width: 300px; margin: 100px auto;">
        <input id="regName" placeholder="Имя">
        <input id="regEmail" placeholder="Email">
        <input id="regPassword" type="password" placeholder="Пароль">
        <button onclick="registerUser()">Регистрация</button>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('freeEloPlayers')) || [];
        let streamData = { player1: "SAYAN", player2: "PLAYER2", clan1: "NUN", clan2: "WAKANDA" };

        function saveData() { localStorage.setItem('freeEloPlayers', JSON.stringify(players)); }

        function finishStreamMatch(winnerNum) {
            const p1Name = document.getElementById('streamMatchPlayer1').value;
            const p2Name = document.getElementById('streamMatchPlayer2').value;
            const p1 = players.find(p => p.name === p1Name);
            const p2 = players.find(p => p.name === p2Name);

            if (!p1 || !p2) { alert("Игроки не найдены!"); return; }

            if (winnerNum === 1) {
                p1.elo += 26; p2.elo = Math.max(0, p2.elo - 32);
                document.getElementById('streamMatchResult').innerHTML = `Победитель: ${p1Name} (+26), ${p2Name} (-32)`;
            } else {
                p2.elo += 26; p1.elo = Math.max(0, p1.elo - 32);
                document.getElementById('streamMatchResult').innerHTML = `Победитель: ${p2Name} (+26), ${p1Name} (-32)`;
            }
            saveData();
            
            // Обновляем данные для стрима
            streamData.player1 = p1Name; streamData.player2 = p2Name;
            localStorage.setItem('freeEloStreamData', JSON.stringify(streamData));
        }

        function registerUser() {
            const newUser = { name: document.getElementById('regName').value, elo: 1000, clan: "NUN" };
            players.push(newUser);
            saveData();
            location.reload();
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('obs') === 'match') {
                document.getElementById('mainContainer').style.display = 'none';
                document.getElementById('authModal').style.display = 'none';
                const obs = document.getElementById('obsOverlayContainer');
                obs.style.display = 'flex';
                obs.className = 'obs-overlay-mode';
                obs.innerHTML = `
                    <div class="obs-cyber-wrapper">
                        <div class="obs-team-box">
                            <div id="liveObsClan1" class="obs-clan-tag"></div>
                            <div id="liveObsPlayer1" class="obs-player-name"></div>
                        </div>
                        <div class="obs-vs-badge">VS</div>
                        <div class="obs-team-box">
                            <div id="liveObsClan2" class="obs-clan-tag"></div>
                            <div id="liveObsPlayer2" class="obs-player-name"></div>
                        </div>
                    </div>
                `;
                
                setInterval(() => {
                    const data = JSON.parse(localStorage.getItem('freeEloStreamData')) || streamData;
                    document.getElementById('liveObsPlayer1').textContent = data.player1;
                    document.getElementById('liveObsPlayer2').textContent = data.player2;
                    document.getElementById('liveObsClan1').textContent = `[${data.clan1}]`;
                    document.getElementById('liveObsClan2').textContent = `[${data.clan2}]`;
                }, 500);
            }
        };
    </script>
</body>
</html>
