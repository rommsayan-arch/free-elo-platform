<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FREE ELO - Matchmaking Platform</title>
    <style>
        :root { --bg: #0b0f19; --card-bg: #121824; --accent: #ff3333; --accent-hover: #e62e2e; --text: #ffffff; --text-muted: #94a3b8; --border: #1e293b; --green: #00be63; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 260px; background: var(--card-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; z-index: 10; }
        .logo-area { font-size: 24px; font-weight: 900; color: var(--accent); letter-spacing: 1px; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .nav-menu { list-style: none; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .nav-item { padding: 12px 16px; border-radius: 8px; cursor: pointer; color: var(--text-muted); font-weight: 600; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: var(--accent); color: var(--text); }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .top-bar { height: 70px; background: var(--card-bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
        .page-container { padding: 30px; }
        .page-content { display: none; }
        .page-content.active { display: block; }
        
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: var(--accent-hover); }
        .btn-success { background: var(--green); }
        input, select { width: 100%; padding: 10px; margin-bottom: 10px; background: var(--bg); border: 1px solid var(--border); color: white; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-size: 14px; }

        #authModal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-card { background: var(--card-bg); border: 1px solid var(--border); padding: 30px; border-radius: 12px; width: 350px; }

        /* OBS ВИДЖЕТ СТИЛИ */
        .obs-overlay-mode { display: flex !important; justify-content: center; align-items: center; height: 100vh; width: 100vw; background: transparent !important; }
        .obs-cyber-wrapper {
            display: flex; align-items: center; gap: 20px;
            background: rgba(10, 10, 15, 0.85);
            border: 2px solid var(--accent);
            box-shadow: 0 0 25px rgba(255, 51, 51, 0.4);
            padding: 15px 30px; border-radius: 12px; backdrop-filter: blur(5px);
        }
        .obs-team-box { display: flex; flex-direction: column; align-items: center; min-width: 180px; }
        .obs-clan-tag {
            font-size: 14px; font-weight: 700; color: var(--green);
            background: rgba(0, 190, 99, 0.15); padding: 2px 10px;
            border-radius: 6px; border: 1px solid rgba(0, 190, 99, 0.3);
            margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px;
        }
        .obs-player-name { font-size: 22px; font-weight: 800; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); letter-spacing: 0.5px; }
        .obs-vs-badge { font-size: 20px; font-weight: 900; color: var(--accent); text-shadow: 0 0 10px rgba(255, 51, 51, 0.8); font-style: italic; padding: 0 10px; }
    </style>
</head>
<body>

    <!-- OBS КОНТЕЙНЕР -->
    <div id="obsOverlayContainer" style="display: none;"></div>

    <!-- САЙДБАР -->
    <div class="sidebar" id="mainSidebar">
        <div class="logo-area">FREE ELO</div>
        <ul class="nav-menu">
            <li class="nav-item active" id="nav-matches" onclick="switchPage('matches')">Матчи</li>
            <li class="nav-item" id="nav-leaderboard" onclick="switchPage('leaderboard')">Топ 100</li>
            <li class="nav-item" id="nav-shop" onclick="switchPage('shop')">Магазин</li>
            <li class="nav-item" id="nav-admin" onclick="switchPage('admin')" style="display:none;">Админка</li>
        </ul>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="main-content" id="mainContainer">
        <div class="top-bar">
            <h2 id="pageTitle">МАТЧИ И СТАТИСТИКА</h2>
            <div id="userName" style="font-weight: bold; color: var(--accent);">Гость</div>
        </div>

        <div class="page-container">
            <div id="page-matches" class="page-content active">
                <div class="card" id="streamerMatchControlCard">
                    <h3>Управление матчем (Стрим)</h3>
                    <label>Игрок 1</label>
                    <select id="streamMatchPlayer1"></select>
                    <label>Игрок 2</label>
                    <select id="streamMatchPlayer2"></select>
                    <div style="margin-top: 15px; display: flex; gap: 10px;">
                        <button class="btn btn-success" onclick="finishStreamMatch(1)">Победа Игрока 1 (+26 ELO)</button>
                        <button class="btn" onclick="finishStreamMatch(2)">Победа Игрока 2 (+26 ELO)</button>
                    </div>
                    <div id="streamMatchResult" style="margin-top: 15px; font-weight: bold;"></div>
                    
                    <div style="margin-top: 20px;">
                        <label>Ссылка для OBS виджета:</label>
                        <input type="text" id="obsLinkCombined" readonly>
                    </div>
                </div>
            </div>

            <div id="page-leaderboard" class="page-content">
                <div class="card">
                    <h3>Таблица лидеров</h3>
                    <table>
                        <thead><tr><th>#</th><th>Игрок</th><th>Клан</th><th>ELO</th></tr></thead>
                        <tbody id="top100TableBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="page-shop" class="page-content">
                <div class="card"><h3>Магазин наград</h3><div id="shopGrid"></div></div>
            </div>

            <div id="page-admin" class="page-content">
                <div class="card"><h3>Панель администратора</h3><p>Управление платформой</p></div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА АВТОРИЗАЦИИ -->
    <div id="authModal">
        <div class="auth-card">
            <h3>Регистрация / Вход</h3>
            <input type="text" id="regName" placeholder="Ваш ник">
            <input type="email" id="regEmail" placeholder="Gmail">
            <input type="password" id="regPassword" placeholder="Пароль">
            <button class="btn" onclick="registerUser()" style="width: 100%;">Войти в систему</button>
        </div>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('freeEloPlayers')) || [
            { id: 1, name: 'SAYAN', email: 'rommsayan@gmail.com', elo: 1200, matches: 10, wins: 7, level: 2, role: 'creator', clan: 'NUN', inventory: [] },
            { id: 2, name: 'PLAYER2', email: 'player2@gmail.com', elo: 1000, matches: 5, wins: 2, level: 1, role: 'player', clan: 'WAKANDA', inventory: [] }
        ];
        
        let shopItems = [
            { id: 1, name: 'Аниме Аватар 1', type: 'avatar', price: 100, img: '' },
            { id: 2, name: 'Неоновая рамка', type: 'frame', price: 250, img: '' }
        ];
        
        let currentUser = null;
        let streamData = { player1: "SAYAN", player2: "PLAYER2", clan1: "NUN", clan2: "WAKANDA" };

        function sanitizeAndValidateUser(user) { return user; }
        
        function saveData() { 
            localStorage.setItem('freeEloPlayers', JSON.stringify(players));
            localStorage.setItem('freeEloStreamData', JSON.stringify(streamData));
        }

        function finishStreamMatch(winnerNum) {
            const p1Name = document.getElementById('streamMatchPlayer1').value;
            const p2Name = document.getElementById('streamMatchPlayer2').value;

            if (p1Name === p2Name) {
                alert("Игроки не могут совпадать!");
                return;
            }

            const p1 = players.find(p => p.name === p1Name);
            const p2 = players.find(p => p.name === p2Name);

            if (!p1 || !p2) return;

            p1.matches++;
            p2.matches++;

            if (winnerNum === 1) {
                p1.wins++;
                p1.elo += 26;
                p2.elo = Math.max(0, p2.elo - 32);
                document.getElementById('streamMatchResult').innerHTML = `<span style="color: #00be63;">Победитель: ${p1Name} (+26 ELO), ${p2Name} (-32 ELO)</span>`;
            } else {
                p2.wins++;
                p2.elo += 26;
                p1.elo = Math.max(0, p1.elo - 32);
                document.getElementById('streamMatchResult').innerHTML = `<span style="color: #ff3333;">Победитель: ${p2Name} (+26 ELO), ${p1Name} (-32 ELO)</span>`;
            }

            streamData.player1 = p1Name;
            streamData.player2 = p2Name;
            streamData.clan1 = p1.clan;
            streamData.clan2 = p2.clan;

            saveData();
            updateUI();
        }

        function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const gmail = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (!name || !gmail || !password) {
                alert("Заполните все поля!");
                return;
            }

            let existing = players.find(p => p.email === gmail);
            if (!existing) {
                existing = {
                    id: Date.now(),
                    name: name,
                    email: gmail,
                    password: password,
                    elo: 1000,
                    matches: 0,
                    wins: 0,
                    level: 1,
                    role: gmail === 'rommsayan@gmail.com' ? 'creator' : 'player',
                    clan: 'NUN',
                    inventory: []
                };
                players.push(existing);
            }

            currentUser = sanitizeAndValidateUser(existing);
            saveData();
            document.getElementById('authModal').style.display = 'none';
            initApp();
        }

        function switchPage(pageId) {
            document.querySelectorAll('.page-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');
            document.getElementById(`nav-${pageId}`).classList.add('active');
        }

        function updateUI() {
            if (!currentUser) return;
            document.getElementById('userName').textContent = currentUser.name;
            if (currentUser.role === 'creator' || currentUser.role === 'admin') {
                document.getElementById('nav-admin').style.display = 'block';
            }
            renderLeaderboard();
            renderShop();
            renderAdminPanel();
        }

        function renderLeaderboard() {
            const tbody = document.getElementById('top100TableBody');
            if(!tbody) return;
            const sorted = [...players].sort((a, b) => b.elo - a.elo);
            tbody.innerHTML = sorted.map((p, index) => `
                <tr>
                    <td>#${index + 1}</td>
                    <td><b>${escapeHtml(p.name)}</b></td>
                    <td><span style="color: var(--green);">[${escapeHtml(p.clan)}]</span></td>
                    <td style="color: var(--accent); font-weight: bold;">${p.elo}</td>
                </tr>
            `).join('');
        }

        function renderShop() {
            const grid = document.getElementById('shopGrid');
            if(!grid) return;
            grid.innerHTML = shopItems.map(item => `
                <div style="background:var(--bg); padding:15px; border-radius:8px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                    <div><h4>${escapeHtml(item.name)}</h4><span style="color:var(--accent);">${item.price} ELO</span></div>
                    <button class="btn" onclick="buyItem(${item.id})">Купить</button>
                </div>
            `).join('');
        }

        function buyItem(id) {
            const item = shopItems.find(i => i.id === id);
            if (currentUser.elo < item.price) { alert("Недостаточно ELO!"); return; }
            currentUser.elo -= item.price;
            currentUser.inventory.push(item);
            saveData();
            updateUI();
        }

        function renderAdminPanel() {
            const selectP1 = document.getElementById('streamMatchPlayer1');
            const selectP2 = document.getElementById('streamMatchPlayer2');
            if(!selectP1 || !selectP2) return;
            const options = players.map(p => `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>`).join('');
            selectP1.innerHTML = options;
            selectP2.innerHTML = options;
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function initApp() {
            updateUI();
        }

        window.onload = function() {
            let cleanBaseUrl = window.location.origin + window.location.pathname;
            const linkInput = document.getElementById('obsLinkCombined');
            if (linkInput) linkInput.value = cleanBaseUrl + '?obs=match';

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('obs') === 'match') {
                document.getElementById('mainSidebar').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'none';
                document.getElementById('authModal').style.display = 'none';

                const obsContainer = document.getElementById('obsOverlayContainer');
                obsContainer.style.display = 'flex';
                obsContainer.className = 'obs-overlay-mode';
                obsContainer.innerHTML = `
                    <div class="obs-cyber-wrapper">
                        <div class="obs-team-box">
                            <div id="liveObsClan1" class="obs-clan-tag"></div>
                            <div id="liveObsPlayer1" class="obs-player-name"></div>
                        </div>
                        <div class="obs-vs-badge">VS</div>
                        <div class="obs-team-box">
                            <div id="liveObsClan2" class="obs-clan-tag"></div>
                            <div id="liveObsPlayer2" class="obs-player-name"></div>
                        </div>
                    </div>
                `;

                function refreshObsStream() {
                    const savedStreamData = JSON.parse(localStorage.getItem('freeEloStreamData')) || streamData;
                    const savedPlayers = JSON.parse(localStorage.getItem('freeEloPlayers')) || players;

                    const p1Name = savedStreamData.player1 || "PLAYER 1";
                    const p2Name = savedStreamData.player2 || "PLAYER 2";

                    document.getElementById('liveObsPlayer1').textContent = p1Name;
                    document.getElementById('liveObsPlayer2').textContent = p2Name;

                    const p1Obj = savedPlayers.find(p => p.name === p1Name);
                    const p2Obj = savedPlayers.find(p => p.name === p2Name);

                    document.getElementById('liveObsClan1').textContent = `[${savedStreamData.clan1 || (p1Obj ? p1Obj.clan : 'NUN')}]`;
                    document.getElementById('liveObsClan2').textContent = `[${savedStreamData.clan2 || (p2Obj ? p2Obj.clan : 'WAKANDA')}]`;
                }

                setInterval(refreshObsStream, 500);
                refreshObsStream();
                return;
            }

            const defaultUser = players.find(p => p.email === 'rommsayan@gmail.com');
            if (defaultUser) {
                currentUser = sanitizeAndValidateUser(defaultUser);
                document.getElementById('authModal').style.display = 'none';
                initApp();
            }
        };
    </script>
</body>
</html>
