<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FREE ELO - Matchmaking Platform</title>
</head>
<body>

    <script>
        // Ваши переменные состояния
        let players = []; 
        let shopItems = [];
        let clans = [];
        let streamers = [];
        let currentUser = null;
        let streamData = {};

        function sanitizeAndValidateUser(user) { return user; }
        function saveData() { /* логика сохранения */ }

        // --- ОБНОВЛЕННАЯ ФУНКЦИЯ ---
        function finishStreamMatch(winnerNum) {
            const p1Name = document.getElementById('streamMatchPlayer1').value;
            const p2Name = document.getElementById('streamMatchPlayer2').value;

            if (p1Name === p2Name) {
                alert("Игроки не могут совпадать!");
                return;
            }

            const p1 = players.find(p => p.name === p1Name);
            const p2 = players.find(p => p.name === p2Name);

            if (!p1 || !p2) return;

            p1.matches++;
            p2.matches++;

            if (winnerNum === 1) {
                p1.wins++;
                p1.elo += 26;
                p2.elo = Math.max(0, p2.elo - 32);
                document.getElementById('streamMatchResult').innerHTML = 
                    `<span style="color: #00be63;">Победитель: ${p1Name} (+26 ELO), ${p2Name} (-32 ELO)</span>`;
            } else {
                p2.wins++;
                p2.elo += 26;
                p1.elo = Math.max(0, p1.elo - 32);
                document.getElementById('streamMatchResult').innerHTML = 
                    `<span style="color: #ff3333;">Победитель: ${p2Name} (+26 ELO), ${p1Name} (-32 ELO)</span>`;
            }

            saveData();
            updateUI();
        }
        // ---------------------------

        function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const gmail = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (!name || !gmail || !password) {
                alert("Заполните все поля регистрации!");
                return;
            }

            if (password.length < 6) {
                alert("Пароль должен быть не менее 6 символов!");
                return;
            }

            const existing = players.find(p => p.email === gmail);
            if (existing) {
                alert("Пользователь с таким Gmail уже существует!");
                return;
            }

            const newUser = {
                id: Date.now(),
                name: name,
                email: gmail,
                password: password,
                elo: 1000,
                matches: 0,
                wins: 0,
                level: 1,
                role: 'player',
                clan: 'Нет клана',
                avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(name)}`,
                frame: '',
                inventory: []
            };

            players.push(newUser);
            currentUser = sanitizeAndValidateUser(newUser);
            saveData();

            document.getElementById('authModal').style.display = 'none';
            initApp();
        }

        function switchPage(pageId) {
            document.querySelectorAll('.page-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            const targetPage = document.getElementById(`page-${pageId}`);
            const targetNav = document.getElementById(`nav-${pageId}`);

            if (targetPage) targetPage.classList.add('active');
            if (targetNav) targetNav.classList.add('active');

            const titles = {
                matches: 'МАТЧИ И СТАТИСТИКА',
                leaderboard: 'ТОП 100 ИГРОКОВ ПЛАТФОРМЫ',
                season: 'ТОП СЕЗОНА 1',
                streamers: 'ПРЯМЫЕ ТРАНСЛЯЦИИ',
                clans: 'КЛАНЫ И СООБЩЕСТВА',
                shop: 'МАГАЗИН НАГРАД',
                admin: 'ПАНЕЛЬ СОЗДАТЕЛЯ И АДМИНИСТРАТОРА'
            };

            document.getElementById('pageTitle').textContent = titles[pageId] || 'FREE ELO';
        }

        function updateUI() {
            if (!currentUser) return;

            document.getElementById('userName').textContent = currentUser.name;
            document.getElementById('widgetName').textContent = currentUser.name;
            document.getElementById('userElo').textContent = currentUser.elo;
            document.getElementById('userMatches').textContent = currentUser.matches;
            
            const winrate = currentUser.matches > 0 ? Math.round((currentUser.wins / currentUser.matches) * 100) : 0;
            document.getElementById('userWinrate').textContent = `${winrate} %`;
            
            currentUser.level = Math.max(1, Math.floor(currentUser.elo / 300) + 1);
            document.getElementById('userLevel').textContent = currentUser.level;
            document.getElementById('widgetClan').textContent = `Клан: ${currentUser.clan}`;

            const roleBadge = document.getElementById('roleBadge');
            roleBadge.textContent = currentUser.role.toUpperCase();
            
            if (currentUser.role === 'admin' || currentUser.role === 'creator') {
                document.getElementById('nav-admin').style.display = 'block';
                document.querySelectorAll('.admin-obs-only').forEach(el => el.style.display = 'block');
            }
            if (currentUser.role === 'streamer' || currentUser.role === 'admin' || currentUser.role === 'creator') {
                document.getElementById('streamerMatchControlCard').style.display = 'block';
            }

            document.getElementById('userAvatar').src = currentUser.avatar;
            document.getElementById('widgetAvatar').src = currentUser.avatar;

            const frameImg = document.getElementById('userFrame');
            const widgetFrame = document.getElementById('widgetFrame');
            if (currentUser.frame) {
                frameImg.src = currentUser.frame;
                frameImg.style.display = 'block';
                widgetFrame.src = currentUser.frame;
                widgetFrame.style.display = 'block';
            } else {
                frameImg.style.display = 'none';
                widgetFrame.style.display = 'none';
            }

            renderLeaderboard();
            renderTop100();
            renderSeasonLeaderboard();
            renderShop();
            renderInventory();
            renderClans();
            renderStreamers();
            renderAdminPanel();
        }

        function renderLeaderboard() {
            const tbody = document.getElementById('leaderboardBody');
            if(!tbody) return;
            const sorted = [...players].sort((a, b) => b.elo - a.elo).slice(0, 5);
            tbody.innerHTML = sorted.map((p, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td><b>${escapeHtml(p.name)}</b></td>
                    <td><span class="level-badge">${p.level}</span></td>
                    <td style="color: var(--accent); font-weight: bold;">${p.elo}</td>
                    <td>${p.matches}</td>
                    <td><span class="role-badge">${p.role}</span></td>
                </tr>
            `).join('');
        }

        function renderTop100() {
            const tbody = document.getElementById('top100TableBody');
            if(!tbody) return;
            const sorted = [...players].sort((a, b) => b.elo - a.elo).slice(0, 100);
            tbody.innerHTML = sorted.map((p, index) => `
                <tr>
                    <td>#${index + 1}</td>
                    <td><b>${escapeHtml(p.name)}</b></td>
                    <td>${escapeHtml(p.clan)}</td>
                    <td><span class="level-badge">${p.level}</span></td>
                    <td style="color: var(--accent); font-weight: bold;">${p.elo}</td>
                    <td>${p.matches} / ${p.wins}</td>
                    <td><span class="role-badge">${p.role}</span></td>
                </tr>
            `).join('');
        }

        function renderSeasonLeaderboard() {
            const tbody = document.getElementById('seasonLeaderboardBody');
            if(!tbody) return;
            const sorted = [...players].sort((a, b) => b.elo - a.elo).slice(0, 10);
            tbody.innerHTML = sorted.map((p, index) => `
                <tr>
                    <td>#${index + 1}</td>
                    <td><b>${escapeHtml(p.name)}</b></td>
                    <td style="color: var(--accent); font-weight: bold;">${p.elo} ELO</td>
                    <td>Уровень ${p.level}</td>
                </tr>
            `).join('');
        }

        function renderShop(filter = 'all') {
            const grid = document.getElementById('shopGrid');
            if(!grid) return;
            const filtered = filter === 'all' ? shopItems : shopItems.filter(i => i.type === filter);
            grid.innerHTML = filtered.map(item => `
                <div class="shop-item">
                    <img src="${item.img}" alt="${escapeHtml(item.name)}">
                    <h4>${escapeHtml(item.name)}</h4>
                    <p style="color: var(--accent); font-weight: bold;">${item.price} ELO</p>
                    <button class="btn btn-primary" onclick="buyItem(${item.id})">Купить</button>
                </div>
            `).join('');
        }

        function buyItem(id) {
            const item = shopItems.find(i => i.id === id);
            if (!item) return;
            if (currentUser.elo < item.price) {
                alert("Недостаточно ELO!");
                return;
            }
            currentUser.elo -= item.price;
            currentUser.inventory.push(item);
            saveData();
            updateUI();
        }

        function renderInventory() {
            const grid = document.getElementById('inventoryGrid');
            if(!grid) return;
            grid.innerHTML = currentUser.inventory.map(item => `
                <div class="inventory-item">
                    <img src="${item.img}" alt="${escapeHtml(item.name)}">
                    <h4>${escapeHtml(item.name)}</h4>
                    <button class="btn btn-success" onclick="equipItem(${item.id})">Надеть</button>
                </div>
            `).join('');
        }

        function equipItem(id) {
            const item = currentUser.inventory.find(i => i.id === id);
            if (!item) return;
            if (item.type === 'avatar') currentUser.avatar = item.img;
            else currentUser.frame = item.img;
            saveData();
            updateUI();
        }

        function renderClans() {
            const list = document.getElementById('clanList');
            if(!list) return;
            list.innerHTML = clans.map(c => `
                <div class="clan-card">
                    <h3>[${escapeHtml(c.tag)}] ${escapeHtml(c.name)}</h3>
                    <button class="btn btn-secondary" onclick="joinClan('${escapeHtml(c.name)}')">Вступить</button>
                </div>
            `).join('');
        }

        function joinClan(name) {
            const clan = clans.find(c => c.name === name);
            if (!clan) return;
            currentUser.clan = clan.name;
            saveData();
            updateUI();
        }

        function renderStreamers() {
            const list = document.getElementById('streamersList');
            if(!list) return;
            list.innerHTML = streamers.map(s => `
                <div class="streamer-card">
                    <h3>${escapeHtml(s.name)}</h3>
                    <a href="${escapeHtml(s.url)}" target="_blank" class="btn">Смотреть</a>
                </div>
            `).join('');
        }

        function renderAdminPanel() {
            const selectP1 = document.getElementById('streamMatchPlayer1');
            const selectP2 = document.getElementById('streamMatchPlayer2');
            const options = players.map(p => `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>`).join('');
            if(selectP1) selectP1.innerHTML = options;
            if(selectP2) selectP2.innerHTML = options;
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function initApp() {
            updateUI();
        }

        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
